// Protocol of the "Notification" channel: Android notifications -> Windows notification center, and user
// actions from Windows back to the app (click, inline reply, swipe-away).
//
// The schema is taken from the host WsaClient.exe (bin/proto-from-wsaclient.py, file Notification.proto):
// these are Microsoft's genuine field numbers and enum values, not a reconstruction. Names here
// are adapted to our style (camelCase); names do not go on the wire. Guest reference:
// com.microsoft.windows.redirection.NotificationRedirectionHandler from SystemUIApp.apk; analysis and
// how our implementation differs: docs/wsa-shell-protocol.md, section on the "Notification" channel.
syntax = "proto2";

// Own package: "Intents" and "Clipboard" both also have a Result with the same fields.
package wsa.rcm.notification;

option java_package = "org.wsalineage.shellbridge.proto";
option java_outer_classname = "Notification";

import "common.proto";

message Result {
  required bool succeeded = 1;
  optional string errorMessage = 2;
}

// Notification text as Windows will show it.
message NotificationDetail {
  optional string appName = 1;  // visible app name, not the package name
  optional string title = 2;
  optional string text = 3;
}

// Progress bar (Notification.Builder.setProgress).
message NotificationProgress {
  required int32 max = 1;
  optional int32 progress = 2;
  optional bool indeterminate = 3;
}

// Notification button. inputKey is non-empty if the button has an input field (RemoteInput):
// these are the keys under which the app expects the reply.
message NotificationAction {
  required string title = 1;
  repeated string inputKey = 2;
}

// What exactly the user clicked in Windows. Empty means a click on the notification body (contentIntent).
message NotificationActivation {
  optional string action = 1;     // button title, matches NotificationAction.title
  optional string replyKey = 2;   // one of inputKey
  optional string replyData = 3;  // entered text
}

// Pictures travel over the channel whole (unlike the clipboard, where only a manifest goes over it).
message NotificationImage {
  optional PNG icon = 1;   // large icon (Notification.getLargeIcon)
  optional PNG image = 2;  // BigPictureStyle picture
}

message NotificationMessage {
  enum MessageType {
    SendNotification = 0;             // guest -> host: a notification appeared
    CancelNotification = 1;           // guest -> host: notification removed in Android
    Activation = 2;                   // host -> guest: user clicked in Windows
    Dismissal = 3;                    // host -> guest: user swiped it away in Windows
    Toast = 4;                        // guest -> host: pop-up message (Toast)
    ReportNotificationSeenEvent = 5;  // host -> guest: notification shown to the user
  }
  required MessageType messageType = 1;
  required ActivityId activityId = 2;  // operation GUID, generated by the initiator
  // The triple (packageName, id, tag) identifies a notification on both sides;
  // it is the StatusBarNotification key, just split into parts.
  required string packageName = 3;
  required int32 id = 4;
  optional Result result = 5;
  optional NotificationDetail detail = 6;
  optional NotificationProgress progress = 7;
  repeated NotificationAction action = 8;
  optional NotificationActivation activation = 9;
  optional NotificationImage image = 10;
  required string tag = 11;            // empty string if the notification has no tag
  optional int32 toastDurationInMilliseconds = 12;
}
