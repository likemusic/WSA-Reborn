// Protocol of the "Clipboard" channel: shared Windows <-> Android clipboard.
//
// The content itself does NOT travel over the channel — only metadata (type, offset, length). The bytes live in
// a named Windows shared memory section that the guest sees as the file /mnt/shared_mem/<name>
// (Common.SharedMemory). At Microsoft the handler lives in UserApp.apk (ClipboardRedirectionHandler +
// util.ClipboardContentHelper), which was never transplanted; here the protocol is recovered the same way as
// shell.proto — from protobuf-javalite RawMessageInfo. Analysis and exchange order —
// docs/wsa-shell-protocol.md, the "Clipboard" channel section.
syntax = "proto2";

// Own package (not the shared wsa.rcm): the "Intents" channel has its own Result with the same fields,
// and two such messages cannot coexist in one package. The package name does not go on the wire.
package wsa.rcm.clipboard;

option java_package = "org.wsalineage.shellbridge.proto";
option java_outer_classname = "Clipboard";

import "common.proto";

message Result {
  required bool succeeded = 1;
  optional string errorMessage = 2;
}

// One clipboard item: where its bytes are in the section and how to interpret them.
message ClipboardContentItem {
  enum ContentItemType {
    Text = 1;    // UTF-8
    Html = 2;    // UTF-8, markup
    Uri = 3;     // UTF-8, URI string
    Bitmap = 4;  // PNG
    File = 5;    // UTF-8, file GUID for WindowsContentProvider ("FileSystem" channel)
  }
  required uint32 size = 1;
  required uint32 offset = 2;
  required ContentItemType contentItemType = 3;
}

message ClipboardData {
  repeated ClipboardContentItem clipboardContent = 1;
}

// Host reply to the guest's request: here is a section, you may write to it.
message RequestSharedMemory {
  required SharedMemory clipboardSharedMemory = 1;
}

message SetClipboardContent {
  required SharedMemory clipboardSharedMemory = 1;
  required ClipboardData clipboardData = 2;
}

message ClipboardMessage {
  enum MessageType {
    SetServerClipboardContent = 1;  // host -> guest: copied in Windows, put it into the Android clipboard
    SetClientClipboardContent = 2;  // guest -> host: copied in Android, put it into the Windows clipboard
    RequestSharedMemory = 3;        // guest -> host: give me a section to write to
  }
  required MessageType messageType = 1;
  required ActivityId activityId = 2;      // operation GUID, generated by the initiator
  optional Result result = 3;              // reply of the receiving side
  optional RequestSharedMemory requestSharedMemory = 4;
  optional SetClipboardContent setClipboardContent = 5;
}
